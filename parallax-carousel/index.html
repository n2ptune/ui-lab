<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Parallax Carousel</title>
    <link rel="stylesheet" href="../common/reset.css" />
    <link rel="stylesheet" href="../common/font.css" />
    <link rel="stylesheet" href="./index.css" />
  </head>
  <body>
    <main class="scene">
      <header class="intro" aria-labelledby="page-title">
        <h1 id="page-title">Parallax Carousel</h1>
      </header>

      <section class="carousel" aria-label="Parallax image carousel">
        <div class="carousel-viewport" data-carousel-viewport>
          <div class="carousel-track" data-carousel-track>
            <article class="carousel-slide" data-slide>
              <img
                src="https://picsum.photos/seed/parallax-forest/960/1280"
                alt="Misty forest path"
              />
              <span class="slide-title">Misty Forest</span>
            </article>
            <article class="carousel-slide" data-slide>
              <img
                src="https://picsum.photos/seed/parallax-desert/960/1280"
                alt="Warm desert ridge"
              />
              <span class="slide-title">Desert Ridge</span>
            </article>
            <article class="carousel-slide" data-slide>
              <img
                src="https://picsum.photos/seed/parallax-ice/960/1280"
                alt="Blue ice valley"
              />
              <span class="slide-title">Ice Valley</span>
            </article>
            <article class="carousel-slide" data-slide>
              <img
                src="https://picsum.photos/seed/parallax-coast/960/1280"
                alt="Rocky coast at dusk"
              />
              <span class="slide-title">Rocky Coast</span>
            </article>
            <article class="carousel-slide" data-slide>
              <img
                src="https://picsum.photos/seed/parallax-city/960/1280"
                alt="City lights"
              />
              <span class="slide-title">City Lights</span>
            </article>
            <article class="carousel-slide" data-slide>
              <img
                src="https://picsum.photos/seed/parallax-lake/960/1280"
                alt="Quiet mountain lake"
              />
              <span class="slide-title">Quiet Lake</span>
            </article>
            <article class="carousel-slide" data-slide>
              <img
                src="https://picsum.photos/seed/parallax-canyon/960/1280"
                alt="Sunlit canyon wall"
              />
              <span class="slide-title">Canyon Light</span>
            </article>
          </div>
        </div>

        <div class="carousel-toolbar" aria-label="Carousel controls">
          <button
            class="control-button"
            type="button"
            data-prev
            aria-label="Previous slide"
          >
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M15 5 8 12l7 7" />
            </svg>
          </button>
          <button
            class="control-button is-pause"
            type="button"
            data-toggle
            aria-label="Pause autoplay"
          >
            <svg class="pause-icon" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M8 5v14M16 5v14" />
            </svg>
            <svg class="play-icon" viewBox="0 0 24 24" aria-hidden="true">
              <path d="m8 5 11 7-11 7V5Z" />
            </svg>
          </button>
          <button
            class="control-button"
            type="button"
            data-next
            aria-label="Next slide"
          >
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="m9 5 7 7-7 7" />
            </svg>
          </button>
        </div>

        <div
          class="progress"
          aria-label="Carousel progress"
          data-progress
        ></div>
      </section>
    </main>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <script src="./index.js"></script>
  </body>
</html>
